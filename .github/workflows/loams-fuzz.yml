# Nightly fuzzing of code Loams Postgres owns (design §51 §3.7, D820; LP-0008):
# nobody else fuzzes it since the hard fork. Targets are in fuzz/:
#   wal_decoder_record     WAL record decoding and interpretation (wal_decoder)
#   page_service_request   the pageserver's page-service request parser
#   proxy_startup          the proxy's startup-packet parser
#   proxy_scram            the proxy's SASL and SCRAM message parsers
# Each runs 30 minutes, with its corpus kept in the Actions cache.
#
# A crash is an undisclosed vulnerability, and this repository's run logs are
# public: the fuzzer's output goes to a file, never to the log, and is filed
# with the reproducer as a private issue in the SLA tracker (scripts/loams/sla.py
# refuses a public repository). Nothing is uploaded as an artifact.
#
# Needs, besides Actions being enabled on this repository: the variable
# LOAMS_SLA_REPO and the secret LOAMS_SLA_TOKEN, as loams-advisories.yml.
# On a pull request the targets are only built (fuzz_targets_build).
name: loams-fuzz

on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/loams-fuzz.yml
      - fuzz/**
      - proxy/src/fuzzing.rs
      - Cargo.lock

permissions:
  contents: read

concurrency:
  group: loams-fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  SLA_REPO: ${{ vars.LOAMS_SLA_REPO || 'ostrium-labs/loams-postgres-security' }}
  # cargo fuzz needs nightly (sanitizers). This one (1.89.0-nightly) matches the
  # fork's 1.88.0 (rust-toolchain.toml); nightly-2026-09-15 cannot compile the
  # proxy ("overflow evaluating the requirement ... Send" in serverless/mod.rs).
  # Move it with rust-toolchain.toml.
  NIGHTLY: nightly-2025-05-10
  CARGO_FUZZ_VERSION: 0.13.2
  FUZZ_SECONDS: 1800

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The proxy links jemalloc with unprefixed malloc (the workspace's
        # tikv-jemallocator features), which AddressSanitizer cannot run beside:
        # its targets crash at start-up under ASan, so they run without a
        # sanitizer (panics and hangs are still found; the parsers are safe Rust).
        include:
          - { target: wal_decoder_record, sanitizer: address }
          - { target: page_service_request, sanitizer: address }
          - { target: proxy_startup, sanitizer: none }
          - { target: proxy_scram, sanitizer: none }
    env:
      TARGET: ${{ matrix.target }}
      SANITIZER: ${{ matrix.sanitizer }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # vendor/postgres-v* (from ostrium-labs/postgres): postgres_ffi's bindings need the headers.
          submodules: true
          persist-credentials: false
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison flex libreadline-dev zlib1g-dev libssl-dev libicu-dev libseccomp-dev \
            pkg-config protobuf-compiler libclang-dev
      - name: Postgres headers
        run: make -j"$(nproc)" postgres-headers > "$RUNNER_TEMP/headers.log" 2>&1 || { tail -50 "$RUNNER_TEMP/headers.log"; exit 1; }
      - name: Toolchain and cargo-fuzz
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          cargo install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"
      - name: Build the target (fuzz_targets_build)
        run: |
          # cargo fuzz has no --locked: refuse a Cargo.lock that needs changes first.
          cargo metadata --locked --format-version 1 > /dev/null
          cargo "+$NIGHTLY" fuzz build --sanitizer "$SANITIZER" "$TARGET"

      - name: Restore the corpus
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: loams-fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: loams-fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        id: fuzz
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "fuzz/corpus/$TARGET" "fuzz/artifacts/$TARGET"
          set +e
          # The output stays in a file: it may describe a vulnerability.
          # RUST_BACKTRACE: sla.py keys a panic in std or a dependency on our frame.
          RUST_BACKTRACE=1 cargo "+$NIGHTLY" fuzz run --sanitizer "$SANITIZER" "$TARGET" "fuzz/corpus/$TARGET" -- \
            -max_total_time="$FUZZ_SECONDS" > "$RUNNER_TEMP/fuzz.log" 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "fuzzer exit status: $status; corpus: $(ls "fuzz/corpus/$TARGET" | wc -l) inputs"
      - name: Save the corpus
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: loams-fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: File crashes privately
        if: github.event_name != 'pull_request' && steps.fuzz.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.LOAMS_SLA_TOKEN }}
        run: |
          shopt -s nullglob
          artifacts=("fuzz/artifacts/$TARGET"/*)
          if [ ${#artifacts[@]} -eq 0 ]; then
            # The fuzzer failed without writing an input: file its output anyway.
            : > "$RUNNER_TEMP/no-artifact"
            artifacts=("$RUNNER_TEMP/no-artifact")
          fi
          for artifact in "${artifacts[@]}"; do
            python3 -I scripts/loams/sla.py file --repo "$SLA_REPO" --kind fuzz \
              --target "$TARGET" --artifact "$artifact" --log "$RUNNER_TEMP/fuzz.log"
          done
          echo "::error::$TARGET failed; filed privately in the SLA tracker"
          exit 1
