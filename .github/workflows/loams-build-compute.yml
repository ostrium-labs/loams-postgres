# The compute images (compute/compute-node.Dockerfile, LP-0011, NF1 Task 11):
#   ghcr.io/ostrium-labs/loams-postgres-compute-v<N>:<pgminor>-<sha12> and :edge
#   (a beta major: <pgminor>-beta-<sha12> and :beta), amd64 and arm64 (Q729).
# The majors are Loams' pin file's supported, maintenance and beta lists (today
# 16 and 17), and each major's minor comes from vendor/revisions.json
# (scripts/loams/compute-matrix.py).
#
# On main, the heavy stages (scripts/loams/compute-heavy-stages.txt) build first,
# each in its own job with --target <stage>, writing only its registry cache
# (loams-postgres-buildcache:compute-v<N>-<arch>-<stage>). The image build then
# reads all of them and its own cache, so it starts warm and stays within the
# 6-hour job limit. It pushes by digest; `index` joins the architectures, tags
# and attests the index; `smoke` creates every core extension and runs the
# pg_stat_statements, pgvector and PostGIS queries
# (compute/tests/loams-smoke/core-extensions.sql) on a compute attached to the
# storage stack (scripts/loams/smoke/); `audit` fails on CDDL code or a private
# source in any binary, compute_ctl, local_proxy and fast_import included.
# Timings go to each run's summary (Q721). Signing comes with NF1 Task 12, and
# loams-release.yml (Task 13) calls this workflow with a build tag.
#
# A pull request builds every major and architecture from main's caches and
# pushes nothing (no heavy jobs, no smoke).
#
# Needs, besides Actions being enabled on this repository: the storage image the
# smoke runs (vars.SMOKE_STORAGE_IMAGE, default loams-postgres-storage:edge from
# loams-build-storage.yml).
name: loams-build-compute

on:
  pull_request:
    branches: [main]
    paths:
      - compute/**
      - compute_tools/**
      - pgxn/**
      - vendor/**
      - libs/**
      - proxy/**
      - Cargo.toml
      - Cargo.lock
      - .dockerignore
      - about.toml
      - about.hbs
      - docker-compose/ext-src/**
      - scripts/loams/compute-matrix.py
      - scripts/loams/compute-heavy-stages.txt
      - scripts/loams/smoke/**
      - .github/workflows/loams-build-compute.yml
  # The same paths as a pull request: a push that cannot change the image
  # builds nothing (each run is hours of runners).
  push:
    branches: [main]
    paths:
      - compute/**
      - compute_tools/**
      - pgxn/**
      - vendor/**
      - libs/**
      - proxy/**
      - Cargo.toml
      - Cargo.lock
      - .dockerignore
      - about.toml
      - about.hbs
      - docker-compose/ext-src/**
      - scripts/loams/compute-matrix.py
      - scripts/loams/compute-heavy-stages.txt
      - scripts/loams/smoke/**
      - .github/workflows/loams-build-compute.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      build-tag:
        description: "BUILD_TAG, e.g. lp-2026.10.0 (default: the commit's sha12)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: loams-build-compute-${{ github.ref }}-${{ inputs.build-tag || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ghcr.io/ostrium-labs/loams-postgres-compute
  CACHE: ghcr.io/ostrium-labs/loams-postgres-buildcache
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
  SMOKE_STORAGE_IMAGE: ${{ vars.SMOKE_STORAGE_IMAGE || 'ghcr.io/ostrium-labs/loams-postgres-storage:edge' }}
  RUST_AUDIT_INFO_VERSION: 0.5.4

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      majors: ${{ steps.plan.outputs.majors }}
      heavy: ${{ steps.plan.outputs.heavy }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Majors from Loams' pin file
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/ostrium-labs/loams/contents/deploy/pins/loams-postgres-images.toml \
            -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/pins.toml"
          python3 -I scripts/loams/compute-matrix.py --pins "$RUNNER_TEMP/pins.toml" --sha "$GITHUB_SHA" \
            | tee -a "$GITHUB_OUTPUT"

  heavy:
    name: heavy ${{ matrix.target.stage }} (v${{ matrix.target.pg }}, ${{ matrix.arch }})
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.arch == 'arm64' && (vars.RUNNER_HEAVY_ARM || 'ubuntu-24.04-arm') || (vars.RUNNER_HEAVY || 'ubuntu-24.04') }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.heavy) }}
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The stages run make -j$(nproc) themselves; parallel stages would
          # exhaust the runner (as Neon's CI found).
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.target.stage }} into the cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: compute/compute-node.Dockerfile
          target: ${{ matrix.target.stage }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            PG_VERSION=${{ matrix.target.pg_version }}
            DEBIAN_VERSION=${{ matrix.target.debian }}
          cache-from: type=registry,ref=${{ env.CACHE }}:compute-${{ matrix.target.pg_version }}-${{ matrix.arch }}-${{ matrix.target.stage }}
          cache-to: type=registry,ref=${{ env.CACHE }}:compute-${{ matrix.target.pg_version }}-${{ matrix.arch }}-${{ matrix.target.stage }},mode=max
          outputs: type=cacheonly
      - name: Timing (heavy_stage_jobs_under_limit)
        run: |
          echo "compute ${{ matrix.target.pg_version }} ${{ matrix.arch }} ${{ matrix.target.stage }}: $((SECONDS / 60)) min" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build v${{ matrix.major.pg }} (${{ matrix.arch }})
    needs: [plan, heavy]
    # The heavy jobs are skipped on a pull request; the build still runs.
    if: always() && needs.plan.result == 'success' && (needs.heavy.result == 'success' || needs.heavy.result == 'skipped')
    runs-on: ${{ matrix.arch == 'arm64' && (vars.RUNNER_HEAVY_ARM || 'ubuntu-24.04-arm') || (vars.RUNNER_HEAVY || 'ubuntu-24.04') }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        major: ${{ fromJSON(needs.plan.outputs.majors) }}
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Caches to read
        id: cache
        env:
          PGV: ${{ matrix.major.pg_version }}
          ARCH: ${{ matrix.arch }}
          INPUT_TAG: ${{ inputs.build-tag }}
        run: |
          set -euo pipefail
          {
            echo "from<<EOF"
            echo "type=registry,ref=$CACHE:compute-$PGV-$ARCH"
            grep -vE '^[[:space:]]*(#|$)' scripts/loams/compute-heavy-stages.txt | while read -r stage; do
              echo "type=registry,ref=$CACHE:compute-$PGV-$ARCH-$stage"
            done
            echo "EOF"
            echo "build-tag=${INPUT_TAG:-${GITHUB_SHA:0:12}}"
          } >> "$GITHUB_OUTPUT"
      - name: Build${{ env.PUBLISH == 'true' && ' and push by digest' || '' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: compute/compute-node.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            GIT_VERSION=${{ github.sha }}
            PG_VERSION=${{ matrix.major.pg_version }}
            DEBIAN_VERSION=${{ matrix.major.debian }}
            BUILD_TAG=${{ steps.cache.outputs.build-tag }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUBLISH == 'true' }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ env.PUBLISH == 'true' && format('type=registry,ref={0}:compute-{1}-{2},mode=max', env.CACHE, matrix.major.pg_version, matrix.arch) || '' }}
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0}-{1},push-by-digest=true,name-canonical=true,push=true', env.IMAGE_PREFIX, matrix.major.pg_version) || 'type=cacheonly' }}
      - name: Record the digest and the build time
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.major.pg_version }}-${{ matrix.arch }}
        run: |
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest: '$DIGEST'"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/$NAME"
          echo "compute $NAME: $DIGEST, job time $((SECONDS / 60)) min" >> "$GITHUB_STEP_SUMMARY"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compute-digest-${{ matrix.major.pg_version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.major.pg_version }}-${{ matrix.arch }}
          retention-days: 7

  index:
    name: index v${{ matrix.major.pg }}
    needs: [plan, build]
    if: always() && needs.build.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        major: ${{ fromJSON(needs.plan.outputs.majors) }}
    env:
      IMAGE: ${{ format('{0}-{1}', 'ghcr.io/ostrium-labs/loams-postgres-compute', matrix.major.pg_version) }}
      PGV: ${{ matrix.major.pg_version }}
      TAGS: ${{ join(matrix.major.tags, ' ') }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: compute-digest-${{ matrix.major.pg_version }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One index for amd64 and arm64, with its tags
        id: index
        run: |
          set -euo pipefail
          refs=() tag_args=()
          for arch in amd64 arm64; do
            refs+=("$IMAGE@$(cat "$RUNNER_TEMP/digests/$PGV-$arch")")
          done
          for t in $TAGS; do tag_args+=(-t "$IMAGE:$t"); done
          docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"
          first=${TAGS%% *}
          digest=$(docker buildx imagetools inspect "$IMAGE:$first" --format '{{json .Manifest}}' | jq -r .digest)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no index digest for $IMAGE:$first"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$first = $IMAGE@$digest" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build provenance of the index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  smoke:
    name: smoke v${{ matrix.major.pg }}
    needs: [plan, index]
    if: always() && needs.index.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        major: ${{ fromJSON(needs.plan.outputs.majors) }}
    env:
      IMAGE: ${{ format('{0}-{1}', 'ghcr.io/ostrium-labs/loams-postgres-compute', matrix.major.pg_version) }}
      TAG: ${{ matrix.major.tags[0] }}
      PG: ${{ matrix.major.pg }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The index digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest for $IMAGE:$TAG"; exit 1; }
          echo "ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
      - name: Labels and licence files
        env:
          REF: ${{ steps.digest.outputs.ref }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            revision=$(docker buildx imagetools inspect "$REF" \
              --format "{{ json (index .Image \"$platform\").Config.Labels }}" | jq -r '."org.opencontainers.image.revision"')
            [ "$revision" = "$GITHUB_SHA" ] || { echo "$platform: revision label is '$revision', not $GITHUB_SHA"; exit 1; }
          done
          docker run --rm --entrypoint ls "$REF" /usr/share/doc/loams-postgres-compute/LICENSE \
            /usr/share/doc/loams-postgres-compute/NOTICE /usr/share/doc/loams-postgres-compute/LOAMS_PATCHES.md \
            /usr/share/doc/loams-postgres-compute/THIRD_PARTY_LICENSES.html
      - name: Core extensions (core_extensions_create)
        env:
          REF: ${{ steps.digest.outputs.ref }}
        run: scripts/loams/smoke/run.sh "$SMOKE_STORAGE_IMAGE" "$REF" "$PG" compute/tests/loams-smoke/core-extensions.sql

  audit:
    name: audit v${{ matrix.major.pg }}
    needs: [plan, index]
    if: always() && needs.index.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        major: ${{ fromJSON(needs.plan.outputs.majors) }}
    env:
      IMAGE: ${{ format('{0}-{1}', 'ghcr.io/ostrium-labs/loams-postgres-compute', matrix.major.pg_version) }}
      TAG: ${{ matrix.major.tags[0] }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends skopeo binutils
          cargo install --locked rust-audit-info --version "$RUST_AUDIT_INFO_VERSION"
      - name: No CDDL code and no private source in any binary (compute_image_audit_clean)
        env:
          SKOPEO: skopeo
          AUDIT_WORKDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          REGISTRY_AUTH_FILE="$HOME/.docker/config.json" scripts/loams/audit-image.sh "$IMAGE@$digest" \
            > "$RUNNER_TEMP/audit.json"
          for bin in compute_ctl local_proxy fast_import; do
            jq -e --arg b "/usr/local/bin/$bin" 'keys | map(endswith($b)) | any' "$RUNNER_TEMP/audit.json" > /dev/null \
              || { echo "$bin was not audited"; exit 1; }
          done
