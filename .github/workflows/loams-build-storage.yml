# The storage image (Dockerfile, LP-0010, NF1 Task 10):
#   ghcr.io/ostrium-labs/loams-postgres-storage:<sha12> and :edge, amd64 and arm64.
# Each architecture builds on its own runner (vars.RUNNER_HEAVY and
# vars.RUNNER_HEAVY_ARM; standard runners by default), with BuildKit's root on
# /mnt where the runner has room there, `cargo auditable build` (in the
# Dockerfile), the registry cache loams-postgres-buildcache:storage-<arch>
# (written from main only), and a push by digest. The job `index` joins the two
# and attests the index's build provenance; `smoke` starts a minimal stack
# (scripts/loams/smoke/) and runs SELECT 1 through a compute, and checks the
# labels and the licence files; `audit` fails on CDDL code or a private source
# in any binary (scripts/loams/audit-image.sh). Release tags come from
# loams-release.yml (NF1 Task 13), which calls this workflow with a build tag.
#
# A pull request builds both architectures and pushes nothing. Edge builds are
# unsigned and never pinned by Loams.
#
# The image carries /usr/local/v<N> for each major in the Makefile's
# POSTGRES_VERSIONS, 18 (beta) included (NF2 Task 8). The smoke checks each
# major's postgres --version (storage_image_has_majors; storage_image_has_v18).
#
# Needs, besides Actions being enabled on this repository: read access for this
# repository to the package ostrium-labs/neon-archive/compute-node-v17 (the
# smoke's compute until our own compute-v17 exists; set vars.SMOKE_COMPUTE_IMAGE
# to that image then).
name: loams-build-storage

on:
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - Dockerfile
      - .dockerignore
      - Makefile
      - postgres.mk
      - about.toml
      - about.hbs
      - vendor/**
      - libs/**
      - pageserver/**
      - safekeeper/**
      - proxy/**
      - storage_broker/**
      - storage_controller/**
      - storage_scrubber/**
      - endpoint_storage/**
      - control_plane/**
      - pgxn/**
      - workspace_hack/**
      - scripts/loams/smoke/**
      - scripts/loams/audit-image.sh
      - scripts/loams/audit_image.py
      - scripts/loams/storage-majors.py
      - .github/workflows/loams-build-storage.yml
  # The same paths as a pull request: a push that cannot change the image
  # builds nothing (each run is hours of runners).
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - Dockerfile
      - .dockerignore
      - Makefile
      - postgres.mk
      - about.toml
      - about.hbs
      - vendor/**
      - libs/**
      - pageserver/**
      - safekeeper/**
      - proxy/**
      - storage_broker/**
      - storage_controller/**
      - storage_scrubber/**
      - endpoint_storage/**
      - control_plane/**
      - pgxn/**
      - workspace_hack/**
      - scripts/loams/smoke/**
      - scripts/loams/audit-image.sh
      - scripts/loams/audit_image.py
      - scripts/loams/storage-majors.py
      - .github/workflows/loams-build-storage.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      build-tag:
        description: "BUILD_TAG, e.g. lp-2026.10.0 (default: the commit's sha12)"
        type: string
        required: false
    outputs:
      digest:
        description: "The index digest"
        value: ${{ jobs.index.outputs.digest }}

permissions:
  contents: read

concurrency:
  group: loams-build-storage-${{ github.ref }}-${{ inputs.build-tag || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/ostrium-labs/loams-postgres-storage
  CACHE: ghcr.io/ostrium-labs/loams-postgres-buildcache
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
  # The compute the smoke attaches: our compute-v17 once NF1 Task 11 has built it
  # (set vars.SMOKE_COMPUTE_IMAGE), until then Neon's 77e22e4b compute-node-v17
  # as mirrored byte for byte to neon-archive (NF1 Task 1). Test only: never shipped.
  SMOKE_COMPUTE_IMAGE: ${{ vars.SMOKE_COMPUTE_IMAGE || 'ghcr.io/ostrium-labs/neon-archive/compute-node-v17@sha256:13ab146d3e7bbabb25a8532f315ac443e7512351d1ede0bab586def5c70e26c3' }}
  SMOKE_PG_MAJOR: "17"
  # rust-audit-info 0.5.4, as ostrium-labs/loams nf1-pins.yml.
  RUST_AUDIT_INFO_VERSION: 0.5.4

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: "${{ vars.RUNNER_HEAVY || 'ubuntu-24.04' }}" }
          - { arch: arm64, runner: "${{ vars.RUNNER_HEAVY_ARM || 'ubuntu-24.04-arm' }}" }
    steps:
      - name: BuildKit's root on /mnt
        # A standard runner has about 14 GB free on / and more on /mnt; the
        # Postgres and release builds need the room.
        run: |
          df -h / /mnt 2>/dev/null || true
          avail=$(df --output=avail -k /mnt 2>/dev/null | tail -1 || echo 0)
          if [ "${avail:-0}" -gt 40000000 ]; then
            sudo mkdir -p /mnt/docker
            conf=/etc/docker/daemon.json
            if [ -s "$conf" ]; then
              sudo jq '. + {"data-root": "/mnt/docker"}' "$conf" | sudo tee "$conf.new" > /dev/null
              sudo mv "$conf.new" "$conf"
            else
              echo '{"data-root": "/mnt/docker"}' | sudo tee "$conf" > /dev/null
            fi
            sudo systemctl restart docker
            docker info --format 'Docker root: {{.DockerRootDir}}'
          else
            echo "/mnt has ${avail:-0} KiB free; BuildKit stays on /"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # vendor/postgres-v*: ostrium-labs/postgres (relative submodule URLs).
          submodules: true
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.build-tag }}
        run: |
          set -euo pipefail
          echo "build-tag=${INPUT_TAG:-${GITHUB_SHA:0:12}}" >> "$GITHUB_OUTPUT"
          echo "storage ${{ matrix.arch }}: Postgres $(make -s print-postgres-versions)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build${{ env.PUBLISH == 'true' && ' and push by digest' || '' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            GIT_VERSION=${{ github.sha }}
            BUILD_TAG=${{ steps.tag.outputs.build-tag }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUBLISH == 'true' }}
          cache-from: type=registry,ref=${{ env.CACHE }}:storage-${{ matrix.arch }}
          cache-to: ${{ env.PUBLISH == 'true' && format('type=registry,ref={0}:storage-{1},mode=max', env.CACHE, matrix.arch) || '' }}
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
      - name: Record the digest and the build time
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest: '$DIGEST'"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/${{ matrix.arch }}"
          echo "storage ${{ matrix.arch }}: $DIGEST, job time so far $((SECONDS / 60)) min" >> "$GITHUB_STEP_SUMMARY"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storage-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          retention-days: 7

  index:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: storage-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One index for amd64 and arm64, tagged <sha12> and edge
        id: index
        run: |
          set -euo pipefail
          sha12=${GITHUB_SHA:0:12}
          refs=()
          for arch in amd64 arm64; do
            refs+=("$IMAGE@$(cat "$RUNNER_TEMP/digests/$arch")")
          done
          docker buildx imagetools create -t "$IMAGE:$sha12" -t "$IMAGE:edge" "${refs[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$sha12" --format '{{json .Manifest}}' | jq -r .digest)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no index digest for $IMAGE:$sha12"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$sha12 = $IMAGE@$digest" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build provenance of the index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  smoke:
    needs: index
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.index.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Labels (labels_present)
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            labels=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" \
              --format "{{ json (index .Image \"$platform\").Config.Labels }}")
            revision=$(jq -r '."org.opencontainers.image.revision"' <<<"$labels")
            [ "$revision" = "$GITHUB_SHA" ] || { echo "$platform: revision label is '$revision', not $GITHUB_SHA"; exit 1; }
            jq -e '."org.opencontainers.image.source" == "https://github.com/ostrium-labs/loams-postgres"' <<<"$labels" > /dev/null
          done
      - name: Licence files in the image
        run: |
          docker run --rm --entrypoint ls "$IMAGE@$DIGEST" /usr/share/doc/loams-postgres/LICENSE \
            /usr/share/doc/loams-postgres/NOTICE /usr/share/doc/loams-postgres/LOAMS_PATCHES.md \
            /usr/share/doc/loams-postgres/THIRD_PARTY_LICENSES.html
      - name: Every Postgres major's binaries (storage_image_has_majors; storage_image_has_v18 at 18)
        run: |
          set -euo pipefail
          python3 -I scripts/loams/storage-majors.py "$IMAGE@$DIGEST" "$(make -s print-postgres-versions)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: SELECT 1 through a compute (smoke_select_1)
        env:
          EXPECT_COMMIT: ${{ github.sha }}
        run: scripts/loams/smoke/run.sh "$IMAGE@$DIGEST" "$SMOKE_COMPUTE_IMAGE" "$SMOKE_PG_MAJOR"

  audit:
    needs: index
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.index.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends skopeo binutils
          cargo install --locked rust-audit-info --version "$RUST_AUDIT_INFO_VERSION"
      - name: No CDDL code and no private source in any binary (storage_image_audit_clean)
        env:
          SKOPEO: skopeo
          AUDIT_WORKDIR: ${{ runner.temp }}
        run: |
          REGISTRY_AUTH_FILE="$HOME/.docker/config.json" scripts/loams/audit-image.sh "$IMAGE@$DIGEST" \
            > "$RUNNER_TEMP/audit.json"
          jq -r 'keys[]' "$RUNNER_TEMP/audit.json"
