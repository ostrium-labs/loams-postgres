# Build hygiene (NF1 Task 7, LP-0002 to LP-0006): no upstream workflow is
# left, nothing CDDL is in the graph (cargo deny licenses; no inferno), and no
# file that decides a download names neondatabase or cache.neon.build
# (scripts/loams/check-no-private-sources.sh). NF1 Task 16 folds this job into
# the gate's G0.
name: loams-hygiene

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: loams-hygiene-${{ github.ref }}
  cancel-in-progress: true

env:
  # cargo-deny 0.20.2 (2026-07-09), checked by sha256, as in loams-advisories.yml.
  CARGO_DENY_URL: https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
  # cargo-about 0.9.2 (2026-08-18), the version the storage Dockerfile uses.
  CARGO_ABOUT_URL: https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz
  CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # neon-fork-point is needed: no_private_sources checks that it fails there.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install cargo-deny
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/deny.tgz" "$CARGO_DENY_URL"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/deny.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tgz" -C "$RUNNER_TEMP" --strip-components=1
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install cargo-about
        run: |
          mkdir -p "$RUNNER_TEMP/about"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/about.tgz" "$CARGO_ABOUT_URL"
          echo "$CARGO_ABOUT_SHA256  $RUNNER_TEMP/about.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/about.tgz" -C "$RUNNER_TEMP/about" --strip-components=1
          echo "CARGO_ABOUT=$RUNNER_TEMP/about/cargo-about" >> "$GITHUB_ENV"
      - name: Hygiene tests
        # The toolchain comes from rust-toolchain.toml (rustup is on the runner).
        run: scripts/loams/tests/test_hygiene.sh
      - name: The image build context holds the workspace
        run: python3 -I scripts/loams/tests/test_docker_context.py
