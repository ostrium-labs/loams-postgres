# Build hygiene (NF1 Task 7, LP-0002 to LP-0006): no upstream workflow is
# left, nothing CDDL is in the graph (cargo deny licenses; no inferno), and no
# file that decides a download names neondatabase or cache.neon.build
# (scripts/loams/check-no-private-sources.sh). NF1 Task 16 folds this job into
# the gate's G0.
name: loams-hygiene

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: loams-hygiene-${{ github.ref }}
  cancel-in-progress: true

env:
  # cargo-deny 0.20.2 (2026-07-09), checked by sha256, as in loams-advisories.yml.
  CARGO_DENY_URL: https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # neon-fork-point is needed: no_private_sources checks that it fails there.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install cargo-deny
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/deny.tgz" "$CARGO_DENY_URL"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/deny.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tgz" -C "$RUNNER_TEMP" --strip-components=1
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Hygiene tests
        # The toolchain comes from rust-toolchain.toml (rustup is on the runner).
        run: scripts/loams/tests/test_hygiene.sh
