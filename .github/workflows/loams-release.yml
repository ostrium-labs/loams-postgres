# Releases lp-YYYY.MM.N (LP-0013, NF1 Task 13; design §51 §5.6, D810).
#
# By hand (workflow_dispatch) or from another workflow (Task 18's minor
# tracking), on main only, with `kind`: storage (the storage image), compute
# (every pinned major's compute image) or full (both):
#   1. refuse an lp- version whose tag exists (tags are immutable; the
#      repository's tag ruleset enforces it too);
#   2. the gate's G0 to G2 (loams-gate.yml, NF1 Task 16);
#   3. build the images for this commit (loams-build-storage.yml,
#      loams-build-compute.yml, which reuse their registry caches);
#   4. write the pin document and the notes (a refused document stops the
#      release before anything is written to the registry), run G3 (Loams'
#      integration, ostrium-labs/loams nf1-candidate.yml) on it, then tag the
#      images with the release: storage lp-YYYY.MM.N, compute
#      <pgminor>-lp-YYYY.MM.N (a beta major <pgminor>-beta-lp-YYYY.MM.N),
#      refusing an image release tag that exists;
#   5. sign, attest and attach sources (loams-sign.yml), per image;
#   6. the git tag and a GitHub Release, whose notes list the digests, the
#      Postgres minors, the extension versions and the patches added or dropped
#      since the last release (scripts/loams/release-notes.py), with the pin
#      document loams-postgres-images.toml as an asset;
#   7. the pin pull request on ostrium-labs/loams: `pins.py set --from-release`
#      on that asset, into dev (needs the secret LOAMS_BOT_TOKEN, the
#      loams-postgres-bot App's token, Q733; without it the job says so and
#      the owner opens the PR by hand).
# Weekly on Tuesdays it also checks the cadence: in the first week of a month,
# a month without a release so far gets an issue on ostrium-labs/loams.
name: loams-release

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "What to release"
        type: choice
        options: [full, storage, compute]
        default: full
      version:
        description: "lp-YYYY.MM.N"
        type: string
        required: true
  workflow_call:
    inputs:
      kind:
        type: string
        required: true
      version:
        type: string
        required: true
  schedule:
    - cron: "37 7 * * 2"

permissions:
  contents: read

concurrency:
  group: loams-release-${{ inputs.version || 'cadence' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      previous: ${{ steps.check.outputs.previous }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Main only, a new lp- tag, a known kind
        id: check
        env:
          VERSION: ${{ inputs.version }}
          KIND: ${{ inputs.kind }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "releases are cut from main, not $GITHUB_REF"; exit 1; }
          case "$KIND" in storage|compute|full) ;; *) echo "kind must be storage, compute or full"; exit 1 ;; esac
          mapfile -t tags < <(git tag -l 'lp-*')
          args=()
          for t in "${tags[@]}"; do args+=(--tag "$t"); done
          python3 -I scripts/loams/release-notes.py check-tag --version "$VERSION" "${args[@]}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=$(python3 -I scripts/loams/release-notes.py previous --version "$VERSION" "${args[@]}")" >> "$GITHUB_OUTPUT"

  # The gate's G0 to G2 on this commit (loams-gate.yml, NF1 Task 16); G3 runs
  # on the built images, before anything is tagged (job g3).
  gate:
    needs: prepare
    uses: ./.github/workflows/loams-gate.yml
    with:
      tiers: g0,g1,g2
    secrets:
      LOAMS_BOT_TOKEN: ${{ secrets.LOAMS_BOT_TOKEN }}

  storage:
    needs: [prepare, gate]
    if: inputs.kind == 'storage' || inputs.kind == 'full'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/loams-build-storage.yml
    with:
      build-tag: ${{ needs.prepare.outputs.version }}

  compute:
    needs: [prepare, gate]
    if: inputs.kind == 'compute' || inputs.kind == 'full'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/loams-build-compute.yml
    with:
      build-tag: ${{ needs.prepare.outputs.version }}

  # The candidate: this commit's digests, the pin document and the notes.
  # Nothing is written to the registry here.
  candidate:
    needs: [prepare, gate, storage, compute]
    if: always() && needs.prepare.result == 'success' && needs.gate.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      sign: ${{ steps.resolve.outputs.sign }}
      tags: ${{ steps.resolve.outputs.tags }}
      doc: ${{ steps.doc.outputs.doc }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PREVIOUS: ${{ needs.prepare.outputs.previous }}
      KIND: ${{ inputs.kind }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Nothing is written to the registry until the release documents are
      # valid: a refused pin document must not leave an lp- image tag behind.
      - name: Resolve this commit's digests (no writes)
        id: resolve
        run: |
          set -euo pipefail
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          free() {
            # An image release tag is never moved or reused either.
            if docker buildx imagetools inspect "$1" > /dev/null 2>&1; then echo "$1 exists"; exit 1; fi
          }
          sha12=${GITHUB_SHA:0:12}
          sign='[]' storage="" compute='{}' tags='[]'
          if [ "$KIND" != compute ]; then
            image=ghcr.io/ostrium-labs/loams-postgres-storage
            storage=$(digest "$image:$sha12")
            free "$image:$VERSION"
            tags=$(jq -c --arg t "$image:$VERSION" --arg r "$image@$storage" '. + [[$t, $r]]' <<<"$tags")
            sign=$(jq -c --arg i "$image" --arg d "$storage" '. + [{image: $i, digest: $d, sources: false, pg_version: "", debian: ""}]' <<<"$sign")
          fi
          if [ "$KIND" != storage ]; then
            gh api repos/ostrium-labs/loams/contents/deploy/pins/loams-postgres-images.toml \
              -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/pins.toml"
            majors=$(python3 -I scripts/loams/compute-matrix.py --pins "$RUNNER_TEMP/pins.toml" --sha "$GITHUB_SHA" \
              | sed -n 's/^majors=//p')
            while read -r m; do
              pgv=$(jq -r .pg_version <<<"$m"); pg=$(jq -r .pg <<<"$m"); minor=$(jq -r .minor <<<"$m")
              debian=$(jq -r .debian <<<"$m"); built=$(jq -r '.tags[0]' <<<"$m")
              beta=$(jq -r 'if .beta then "-beta" else "" end' <<<"$m")
              image=ghcr.io/ostrium-labs/loams-postgres-compute-$pgv
              d=$(digest "$image:$built")
              free "$image:$minor$beta-$VERSION"
              tags=$(jq -c --arg t "$image:$minor$beta-$VERSION" --arg r "$image@$d" '. + [[$t, $r]]' <<<"$tags")
              compute=$(jq -c --arg k "$pg" --arg d "$d" '. + {($k): $d}' <<<"$compute")
              sign=$(jq -c --arg i "$image" --arg d "$d" --arg p "$pgv" --arg b "$debian" \
                '. + [{image: $i, digest: $d, sources: true, pg_version: $p, debian: $b}]' <<<"$sign")
            done < <(jq -c '.[]' <<<"$majors")
          fi
          for x in "$storage" $(jq -r '.[]' <<<"$compute"); do
            [[ -z $x || $x =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest $x"; exit 1; }
          done
          { echo "storage=$storage"; echo "compute=$compute"; echo "sign=$sign"; echo "tags=$tags"; } | tee -a "$GITHUB_OUTPUT"
      - name: The pin document and the notes (refused documents stop the release here)
        id: doc
        env:
          STORAGE: ${{ steps.resolve.outputs.storage }}
          COMPUTE: ${{ steps.resolve.outputs.compute }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          gh api repos/ostrium-labs/loams/contents/deploy/pins/loams-postgres-images.toml \
            -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/loams-pins.toml"
          args=()
          [ -n "$STORAGE" ] && args+=(--storage "$STORAGE")
          while read -r kv; do [ -n "$kv" ] && args+=(--compute "$kv"); done < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"$COMPUTE")
          python3 -I scripts/loams/release-notes.py pin-doc --version "$VERSION" --commit "$GITHUB_SHA" \
            --loams-pins "$RUNNER_TEMP/loams-pins.toml" "${args[@]}" > "$RUNNER_TEMP/release/loams-postgres-images.toml"
          prev=()
          if [ -n "$PREVIOUS" ]; then
            git show "$PREVIOUS:LOAMS_PATCHES.md" > "$RUNNER_TEMP/patches-prev.md"
            prev=(--previous "$PREVIOUS" --patches-prev "$RUNNER_TEMP/patches-prev.md")
          fi
          python3 -I scripts/loams/release-notes.py notes --version "$VERSION" --commit "$GITHUB_SHA" \
            --pin-doc "$RUNNER_TEMP/release/loams-postgres-images.toml" --patches-now LOAMS_PATCHES.md \
            --extensions compute/loams-extensions.toml "${prev[@]}" > "$RUNNER_TEMP/release/notes.md"
          cat "$RUNNER_TEMP/release/notes.md" >> "$GITHUB_STEP_SUMMARY"
          # For G3, which runs Loams' integration on exactly this document.
          eof="EOF_$(openssl rand -hex 8)"
          { echo "doc<<$eof"; cat "$RUNNER_TEMP/release/loams-postgres-images.toml"; echo "$eof"; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/release/
          retention-days: 30

  # G3: Loams' integration on the candidate's images (loams-gate.yml).
  g3:
    needs: [prepare, candidate]
    if: always() && needs.candidate.result == 'success'
    uses: ./.github/workflows/loams-gate.yml
    with:
      tiers: g3
      candidate-pins: ${{ needs.candidate.outputs.doc }}
    secrets:
      LOAMS_BOT_TOKEN: ${{ secrets.LOAMS_BOT_TOKEN }}

  tag-images:
    needs: [candidate, g3]
    if: always() && needs.candidate.result == 'success' && needs.g3.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      TAGS: ${{ needs.candidate.outputs.tags }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the images with the release
        run: |
          set -euo pipefail
          while read -r pair; do
            docker buildx imagetools create -t "$(jq -r '.[0]' <<<"$pair")" "$(jq -r '.[1]' <<<"$pair")"
          done < <(jq -c '.[]' <<<"$TAGS")

  sign:
    needs: [candidate, tag-images]
    if: always() && needs.tag-images.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.candidate.outputs.sign) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/loams-sign.yml
    with:
      image: ${{ matrix.image.image }}
      digest: ${{ matrix.image.digest }}
      sources: ${{ matrix.image.sources }}
      pg-version: ${{ matrix.image.pg_version }}
      debian: ${{ matrix.image.debian }}

  release:
    needs: [prepare, tag-images, sign]
    if: always() && needs.sign.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/release
      - name: The tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$VERSION" -f object="$GITHUB_SHA" -f type=commit \
            -f message="Loams Postgres $VERSION" -q .sha > "$RUNNER_TEMP/tag"
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$(cat "$RUNNER_TEMP/tag")" > /dev/null
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Loams Postgres $VERSION" \
            --notes-file "$RUNNER_TEMP/release/notes.md" "$RUNNER_TEMP/release/loams-postgres-images.toml"

  pin-pr:
    needs: [prepare, release]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ secrets.LOAMS_BOT_TOKEN }}
    steps:
      - name: The pin pull request on ostrium-labs/loams
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::LOAMS_BOT_TOKEN is not set: open the pin PR on ostrium-labs/loams by hand with" \
              "scripts/nf1/pins.py set --from-release https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/loams-postgres-images.toml"
            exit 0
          fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/loams-postgres-images.toml"
          git clone -q --depth 1 --branch dev "https://x-access-token:${GH_TOKEN}@github.com/ostrium-labs/loams.git" loams
          cd loams
          python3 -I scripts/nf1/pins.py set --from-release "$url"
          python3 -I scripts/nf1/pins.py check
          if git diff --quiet; then echo "Loams already pins $VERSION"; exit 0; fi
          bot='loams-postgres-bot[bot]'
          email=$(gh api user -q '"\(.id)+\(.login)@users.noreply.github.com"' 2>/dev/null || echo 'loams-postgres-bot@users.noreply.github.com')
          git switch -q -c "bot/pins-$VERSION"
          git -c user.name="$bot" -c user.email="$email" commit -q -a -F - <<EOF
          deploy(pg): pin Loams Postgres builds $VERSION

          Written by scripts/nf1/pins.py set --from-release $url
          (loams-release.yml, ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          Signed-off-by: $bot <$email>
          EOF
          git push -q origin "bot/pins-$VERSION"
          # The body repeats the release's pin document, so the PR and the release
          # can be compared digest by digest (pin_pr_matches_release).
          curl -fsSL "$url" -o "$RUNNER_TEMP/doc.toml"
          {
            echo "Pins the images of [$VERSION](https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION),"
            echo "from its pin document (\`pins.py set --from-release\`):"
            echo
            echo '```toml'
            cat "$RUNNER_TEMP/doc.toml"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh pr create -R ostrium-labs/loams --base dev --head "bot/pins-$VERSION" \
            --title "deploy(pg): pin Loams Postgres builds $VERSION" --body-file "$RUNNER_TEMP/body.md"

  cadence:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.LOAMS_BOT_TOKEN }}
    steps:
      - name: A monthly roll-up is due and none has shipped
        run: |
          set -euo pipefail
          day=$(date -u +%-d)
          month=$(date -u +%Y.%m)
          if [ "$day" -gt 7 ]; then echo "not the first week of the month"; exit 0; fi
          tags=$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/lp-$month.*" | wc -l)
          if [ "$tags" -gt 0 ]; then echo "lp-$month.* exists"; exit 0; fi
          if [ -z "$GH_TOKEN" ]; then echo "::warning::the $month roll-up is due (LOAMS_BOT_TOKEN unset: no issue opened)"; exit 0; fi
          title="Loams Postgres: the $month roll-up release is due"
          if gh issue list -R ostrium-labs/loams --state open --search "\"$title\" in:title" --json number -q 'length' | grep -qv '^0$'; then
            echo "already open"; exit 0
          fi
          gh issue create -R ostrium-labs/loams --title "$title" \
            --body "No lp-$month.* release of ostrium-labs/loams-postgres yet; design §51 §5.6 ships a compute roll-up monthly (first Tuesday). Run loams-release.yml (kind full)."
