# Signs, attests and (for compute images) attaches the sources of one image
# index (LP-0012, NF1 Task 12). A reusable workflow, called by loams-release.yml
# for each released image and by loams-build-tools.yml; edge builds are not
# signed and are never pinned.
#
# For the index at <image>@<digest>:
#   - cosign sign --yes (keyless, Sigstore): Fulcio's certificate names this
#     workflow (job_workflow_ref) at refs/heads/main, which is what Loams'
#     scripts/nf1/verify-pins.sh accepts:
#       --certificate-oidc-issuer https://token.actions.githubusercontent.com
#       --certificate-identity-regexp '^https://github.com/ostrium-labs/loams-postgres/\.github/workflows/loams-(release|sign)\.yml@refs/heads/main$'
#   - actions/attest-build-provenance, pushed to the registry;
#   - an SPDX SBOM per platform (Syft, through anchore/sbom-action), cut to its
#     packages, licences and purls (scripts/loams/slim-sbom.py: attest-sbom
#     refuses more than 16 MiB) and attested with actions/attest-sbom;
#   - with `sources: true` (compute images): sources.tar, built from the
#     generated loams-sources stage (scripts/loams/compute-sources.py: every
#     downloaded tarball and patch, and Postgres' tree, with SHA256SUMS),
#     attached with `oras attach --artifact-type application/vnd.loams.sources.v1`
#     and signed in turn.
# The caller grants: contents read, packages write, id-token write, attestations write.
name: loams-sign

on:
  workflow_call:
    inputs:
      image:
        description: "The repository, e.g. ghcr.io/ostrium-labs/loams-postgres-storage"
        type: string
        required: true
      digest:
        description: "The index digest, sha256:<64 hex>"
        type: string
        required: true
      sources:
        description: "Attach the compute image's sources (needs pg-version and debian)"
        type: boolean
        default: false
      pg-version:
        description: "PG_VERSION of a compute image, e.g. v17"
        type: string
        default: ""
      debian:
        description: "DEBIAN_VERSION of a compute image, e.g. bookworm"
        type: string
        default: ""

permissions:
  contents: read

env:
  IMAGE: ${{ inputs.image }}
  DIGEST: ${{ inputs.digest }}

jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Inputs
        run: |
          [[ $IMAGE =~ ^ghcr\.io/ostrium-labs/[a-z0-9/_-]+$ ]] || { echo "not an ostrium-labs image: $IMAGE"; exit 1; }
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "not a digest: $DIGEST"; exit 1; }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: cosign sign (keyless)
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ inputs.digest }}
          push-to-registry: true

  sbom:
    name: sbom (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Syft configuration for ${{ matrix.platform }}
        env:
          PLATFORM: ${{ matrix.platform }}
        # Packages only: the files are dropped below anyway (attest-sbom's 16 MiB limit).
        run: |
          printf 'platform: %s\nfile:\n  metadata:\n    selection: none\n' "$PLATFORM" > "$RUNNER_TEMP/syft.yaml"
      - name: SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ inputs.image }}@${{ inputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-full.spdx.json
          config: ${{ runner.temp }}/syft.yaml
          upload-artifact: false
          upload-release-assets: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - name: Packages, licences and purls only (scripts/loams/slim-sbom.py)
        run: python3 -I scripts/loams/slim-sbom.py "$RUNNER_TEMP/sbom-full.spdx.json" "$RUNNER_TEMP/sbom.spdx.json"
      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ inputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

  sources:
    if: inputs.sources
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build sources.tar
        env:
          PGV: ${{ inputs.pg-version }}
          DEBIAN: ${{ inputs.debian }}
        run: |
          set -euo pipefail
          [[ $PGV =~ ^v[0-9]+$ && -n $DEBIAN ]] || { echo "sources: true needs pg-version and debian"; exit 1; }
          python3 -I scripts/loams/compute-sources.py > "$RUNNER_TEMP/sources.Dockerfile"
          docker buildx build -f "$RUNNER_TEMP/sources.Dockerfile" --target loams-sources-out \
            --build-arg "PG_VERSION=$PGV" --build-arg "DEBIAN_VERSION=$DEBIAN" \
            --cache-from "type=registry,ref=ghcr.io/ostrium-labs/loams-postgres-buildcache:compute-$PGV-amd64" \
            --output "type=tar,dest=$RUNNER_TEMP/sources.tar" .
          tar -tf "$RUNNER_TEMP/sources.tar" | grep -qx 'SHA256SUMS'
          ls -la "$RUNNER_TEMP/sources.tar"
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Attach and sign the sources
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          oras attach --artifact-type application/vnd.loams.sources.v1 --format go-template='{{.digest}}' \
            "$IMAGE@$DIGEST" sources.tar:application/x-tar > attached
          attached=$(cat attached)
          [[ $attached =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "oras attach gave no digest: $attached"; exit 1; }
          cosign sign --yes "$IMAGE@$attached"
          oras discover --artifact-type application/vnd.loams.sources.v1 "$IMAGE@$DIGEST"
