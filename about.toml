# cargo about: the third-party licence file of our images
# (/usr/share/doc/loams-postgres/THIRD_PARTY_LICENSES.html, LP-0010).
# The accepted licences are deny.toml's allow list plus its per-crate
# exceptions (Zlib, and NCSA for libfuzzer-sys, which only the fuzz crate uses).
# No CDDL-1.0: nothing CDDL goes into what we publish (LP-0003).
# Render: cargo about generate --locked -o THIRD_PARTY_LICENSES.html about.hbs
# The order is the preference for a crate offered under several licences: MIT
# first, so a dual-licensed crate is listed with its own copyright notice.
accepted = [
    "MIT",
    "Apache-2.0",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "NCSA",
]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-dev-dependencies = true
ignore-build-dependencies = false

# tokio-epoll-uring and uring-common come from Neon's repository (Loams D2450),
# which ships no licence files: cargo about renders their manifests' licences
# (MIT OR Apache-2.0; MIT) with the canonical texts, and about.hbs adds the
# copyright notices from docs/loams/licences/tokio-epoll-uring (LP-0007).
