[package]
name = "postgres_ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
regex.workspace = true
bytes.workspace = true
anyhow.workspace = true
crc32c.workspace = true
once_cell.workspace = true
thiserror.workspace = true
serde.workspace = true
postgres_ffi_types.workspace = true
# Without the tarball helpers, which keeps tokio-tar out of API-only consumers.
utils = { path = "../utils", default-features = false, features = ["rename_noreplace"] }
tracing.workspace = true
postgres_versioninfo.workspace = true

[dev-dependencies]
# Only the waldecoder bench uses it; as a normal dependency it brought its
# flamegraph renderer (inferno) into every consumer.
pprof.workspace = true
criterion.workspace = true
env_logger.workspace = true
postgres.workspace = true

[build-dependencies]
anyhow.workspace = true
bindgen.workspace = true

[[bench]]
name = "waldecoder"
harness = false
