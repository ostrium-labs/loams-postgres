[package]
name = "pageserver_api"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = ["io-align-512", "storage-clients"]
# The pageserver configuration's storage broker and remote storage settings.
# Consumers that need only the API types (Loams' WAL decoder, through
# wal_decoder) turn default features off, which keeps both clients and their
# dependency trees (the HTTP utilities' profilers, the cloud SDKs) out.
storage-clients = ["dep:storage_broker", "dep:remote_storage"]
# See pageserver/Cargo.toml
testing = ["dep:nix"]
# Direct IO alignment options (mutually exclusive)
io-align-512 = []
io-align-4k = []

[dependencies]
serde.workspace = true
serde_with.workspace = true
serde_json.workspace = true
const_format.workspace = true
anyhow.workspace = true
bytes.workspace = true
byteorder.workspace = true
# Without the tarball helpers, which keeps tokio-tar out of API-only consumers.
utils = { path = "../utils", default-features = false, features = ["rename_noreplace"] }
postgres_ffi_types.workspace = true
postgres_versioninfo.workspace = true
posthog_client_lite.workspace = true
enum-map.workspace = true
strum.workspace = true
strum_macros.workspace = true
hex.workspace = true
humantime.workspace = true
thiserror.workspace = true
humantime-serde.workspace = true
chrono = { workspace = true, features = ["serde"] }
itertools.workspace = true
storage_broker = { workspace = true, optional = true }
camino = { workspace = true, features = ["serde1"] }
remote_storage = { workspace = true, optional = true }
postgres_backend.workspace = true
nix = { workspace = true, optional = true }
reqwest.workspace = true
rand.workspace = true
tracing.workspace = true
tracing-utils.workspace = true
once_cell.workspace = true

[dev-dependencies]
bincode.workspace = true
rand.workspace = true
